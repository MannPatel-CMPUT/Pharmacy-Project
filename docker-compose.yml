# Same host: Ollama + Pharmacy API on one Docker network.
# API talks to Ollama at http://ollama:11434 (service name).
#
# First-time Ollama model (after compose up):
#   docker compose exec ollama ollama pull llama3
#
# Optional: load your CSV once (large) — mount file and set env on `api` service.
#
# RAM: Ollama + llama3 needs several GB; use a smaller model on low-memory hosts:
#   docker compose exec ollama ollama pull llama3.2:1b

services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    # Uncomment on Linux + NVIDIA for faster inference (install nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////data/pharmacy.db
      FRONTEND_URL: http://localhost:8000
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-change-me}
      # In-container DNS name for the Ollama service
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: llama3
      OLLAMA_TIMEOUT_SECONDS: "120"
    volumes:
      - pharmacy_data:/data
      # Optional: put db_drug_interactions.csv on host and uncomment:
      # - ./db_drug_interactions.csv:/import/db_drug_interactions.csv:ro
    # Optional CSV ingest on first boot (uncomment and set path inside container):
    # environment:
    #   DRUG_INTERACTIONS_CSV: /import/db_drug_interactions.csv
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_data:
  pharmacy_data:
