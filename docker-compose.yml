# Pharmacy API on a single Docker network with persistent SQLite + portal user store.
#
# First run:
#   JWT_SECRET=<your-secret> docker compose up --build
#
# Optional: load your CSV once by mounting it and setting DRUG_INTERACTIONS_CSV
# (see commented-out lines on the api service).

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////data/pharmacy.db
      FRONTEND_URL: http://localhost:8000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the environment or a .env file}
      PORTAL_USERS_PATH: /data/portal_users.json
    volumes:
      - pharmacy_data:/data
      # Optional: put db_drug_interactions.csv on host and uncomment:
      # - ./db_drug_interactions.csv:/import/db_drug_interactions.csv:ro
    # Optional CSV ingest on first boot (uncomment and set path inside container):
    # environment:
    #   DRUG_INTERACTIONS_CSV: /import/db_drug_interactions.csv
    restart: unless-stopped

volumes:
  pharmacy_data:
